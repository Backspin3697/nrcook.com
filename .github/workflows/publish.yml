name: publish

# Builds the site with a pinned Hugo release and force-pushes the output to the
# `publish` branch. The web server VM pulls that branch on a timer; it never
# builds anything itself. No third-party actions: plain git and curl only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Bump deliberately; check the release notes first.
      HUGO_VERSION: "0.168.0"
    steps:
      - name: Check out main
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/${GITHUB_REPOSITORY}.git" src

      - name: Install Hugo (checksum-verified)
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tgz="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          sums="hugo_${HUGO_VERSION}_checksums.txt"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/$sums"
          grep " ${tgz}\$" "$sums" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tgz" -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: src
        run: |
          hugo version
          hugo --minify --gc
          test -s public/index.html
          test -s public/404.html

      - name: Push to publish branch
        working-directory: src/public
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b publish
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
